<!-- Social share card artwork, 1200x630 (the standard Open Graph size).
     Export this to og-image.png, then uncomment the og:image / twitter:image
     tags in index.html - Facebook and X will not render an SVG preview. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Georgia, serif">
  <rect width="1200" height="630" fill="#F7F6F2"/>
  <circle cx="980" cy="90" r="300" fill="#1E6B4E" opacity="0.07"/>

  <!-- checkerboard mark -->
  <g transform="translate(96,88)">
    <rect width="64" height="64" rx="16" fill="#E7F1EC" stroke="#14503A" stroke-width="3"/>
    <path d="M0 0h32v32H0z M32 32h32v32H32z" fill="#1E6B4E"/>
  </g>
  <text x="180" y="134" font-size="42" font-weight="600" fill="#17190F">Tablecloth</text>

  <text x="96" y="290" font-size="76" font-weight="700" fill="#17190F">Everything your business</text>
  <text x="96" y="374" font-size="76" font-weight="700" fill="#17190F">needs, in one place.</text>

  <text x="96" y="452" font-size="30" fill="#6E7268" font-family="Helvetica, Arial, sans-serif">
    Website · Scheduling · Payments · Domains · Hosting
  </text>

  <rect x="96" y="506" width="250" height="62" rx="31" fill="#1E6B4E"/>
  <text x="221" y="546" font-size="24" font-weight="600" fill="#FFFFFF" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif">gettablecloth.com</text>
</svg>
